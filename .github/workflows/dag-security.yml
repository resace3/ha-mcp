name: DAG Studio security gates

on:
  pull_request:
    branches: [master]
  push:
    branches: [feat/local-dag-studio, master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Audit locked Python dependencies
        run: |
          uv sync --locked --no-dev
          uvx pip-audit --path .venv/lib/python3.13/site-packages
      - name: Scan changed DAG Python code
        run: >-
          uvx bandit -r
          src/ha_mcp/dag_studio
          src/ha_mcp/tools/tools_dag.py
          -ll

name: Publish DAG Studio add-on

on:
  workflow_dispatch:
  push:
    tags: ["dag-v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: homeassistant-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/resace3/ha-mcp-dag-addon-${{ matrix.arch }}:7.12.4
          build-args: |
            BUILD_VERSION=7.12.4
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/resace3/ha-mcp-dag-addon-${{ matrix.arch }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture OCI manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/resace3/ha-mcp-dag-addon:7.12.4 \
            ghcr.io/resace3/ha-mcp-dag-addon-amd64:7.12.4 \
            ghcr.io/resace3/ha-mcp-dag-addon-aarch64:7.12.4
          docker buildx imagetools inspect \
            ghcr.io/resace3/ha-mcp-dag-addon:7.12.4 \
            --format '{{json .Manifest}}' > manifest.json
      - name: Record immutable manifest digest
        id: manifest
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect \
            ghcr.io/resace3/ha-mcp-dag-addon:7.12.4 \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/resace3/ha-mcp-dag-addon
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: dag-addon-oci-manifest
          path: manifest.json
          retention-days: 30

  scan:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/resace3/ha-mcp-dag-addon-${{ matrix.arch }}:7.12.4
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH

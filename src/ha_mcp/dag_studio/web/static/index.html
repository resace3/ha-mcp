<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local DAG Studio</title><style>body{font:14px system-ui;margin:0;background:#f5f7fb;color:#182033}header{padding:14px 20px;background:#17233c;color:white}main{display:grid;grid-template-columns:260px 1fr 280px;gap:12px;padding:12px;height:calc(100vh - 72px)}section,aside{background:white;border:1px solid #dce3ef;border-radius:10px;padding:14px}canvas{width:100%;height:100%;background:linear-gradient(#eef2f8 1px,transparent 1px),linear-gradient(90deg,#eef2f8 1px,transparent 1px);background-size:24px 24px}button,input,select,textarea{margin:4px;padding:8px}#notice{color:#8b3f00}</style></head><body><header><b>Local DAG Studio</b> <button id="new">New DAG</button><button id="save">Save</button><button id="validate">Validate</button><button id="export">Export JSON</button></header><main><aside><h3>AI review</h3><p id="notice">AI is disabled. AI suggestions are advisory and never prove causal or clinical validity.</p><textarea placeholder="Ask about this DAG" disabled></textarea></aside><section><canvas id="canvas" aria-label="DAG canvas"></canvas><p>Use the inspector to add and edit nodes and directed edges.</p><div id="findings"></div></section><aside><h3>Inspector</h3><input id="title" aria-label="DAG title" placeholder="DAG title"><button id="addNode">Add node</button><button id="addEdge">Add edge</button><div id="items"></div></aside></main><script src="./app.js"></script></body></html>
